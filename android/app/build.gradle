apply plugin: 'com.android.application'

android {
    namespace "xyz.corporateladder.linkedout"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "xyz.corporateladder.linkedout"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // versionCode is read from /app/.versioncode (auto-bumped by scripts/build_apk.sh)
        def __vc = 1
        def __vcFile = file("${rootDir}/../.versioncode")
        if (__vcFile.exists()) {
            __vc = __vcFile.text.trim().toInteger()
        }
        // Read semantic versionName from /app/.versionname (e.g. "1.0.0").
        // Falls back to "1.0.0" if file is missing. versionCode keeps auto-bumping.
        def __vn = "1.0.0"
        def __vnFile = file("${rootDir}/../.versionname")
        if (__vnFile.exists()) {
            __vn = __vnFile.text.trim()
        }
        versionCode __vc
        versionName __vn
        // Restrict packaged ABIs to 64-bit (Play Store requirement) + 32-bit ARM
        // for older devices. x86 emulator builds use the debug variant.
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
        resourceConfigurations += ['en']
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            // Per-app keystore for the LinkedOut Play Store listing
            // (xyz.corporateladder.linkedout). Keep this file + the
            // matching env vars in sync — losing either means losing the
            // ability to ever ship updates to the existing Play listing.
            storeFile file('linkedout-release.keystore')
            // Credentials MUST be supplied via env vars in CI / Play upload builds.
            // The dev fallbacks read from /app/.env.keystore (gitignored) — used
            // for local debug-style smoke tests of the release variant.
            storePassword System.getenv('CL_KEYSTORE_PASSWORD') ?: project.findProperty('CL_KEYSTORE_PASSWORD') ?: ''
            keyAlias System.getenv('CL_KEY_ALIAS') ?: project.findProperty('CL_KEY_ALIAS') ?: 'linkedout'
            keyPassword System.getenv('CL_KEY_PASSWORD') ?: project.findProperty('CL_KEY_PASSWORD') ?: ''
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
            // Strip JS console.log etc. is handled by Angular prod build; this strips Java logs.
            debuggable false
        }
        debug {
            // Keep debug builds unminified for fast iteration / readable stack traces.
            minifyEnabled false
            debuggable true
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    packagingOptions {
        resources {
            excludes += ['META-INF/LICENSE*', 'META-INF/NOTICE*', 'META-INF/AL2.0', 'META-INF/LGPL2.1']
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

configurations.all {
    resolutionStrategy {
        // kotlin-stdlib 1.8+ already includes jdk7/jdk8 — exclude the old split modules to fix duplicate-class errors
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
